<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Databáze — interaktivní test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12141D;
    --panel:#1A1D28;
    --panel-hover:#20242F;
    --ink:#F2EDE1;
    --body:#98A0BE;
    --muted:#6E7593;
    --accent:#E8A23D;
    --accent-ink:#1C1406;
    --accent-soft:rgba(232,162,61,0.12);
    --border:#2B2F3E;
    --border-light:#3A3F52;
    --paper-1:#EFE9DA;
    --paper-2:#E6DEC8;
    --paper-ink:#2B2620;
    --ok:#4FAE84;
    --bad:#E2604F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
  }

  .topbar{
    border-bottom:1px solid var(--border);
    padding:18px 24px;
  }
  .topbar-inner{
    max-width:760px;
    margin:0 auto;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.82rem;
    letter-spacing:0.02em;
    color:var(--accent);
    text-transform:uppercase;
  }
  .topbar-inner .sep{color:var(--muted); margin:0 6px; text-transform:none;}
  .topbar-inner{display:flex; align-items:center; justify-content:space-between; max-width:760px;}
  #timer{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    color:var(--body);
    letter-spacing:0.02em;
  }
  #timer.low{color:var(--bad);}

  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:56px 24px 80px;
  }

  /* ---------- Intro (hero) ---------- */
  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    border:1px solid var(--border-light);
    border-radius:999px;
    padding:7px 16px 7px 12px;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.82rem;
    color:var(--accent);
    margin-bottom:26px;
  }
  .eyebrow .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--accent);
    flex-shrink:0;
  }
  .eyebrow .plain{color:var(--body);}

  h1.hero{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:4.2rem;
    line-height:1.02;
    margin:0 0 22px;
    color:var(--ink);
  }
  .lede{
    font-size:1.08rem;
    line-height:1.6;
    color:var(--body);
    max-width:560px;
    margin:0 0 34px;
  }

  .stats{
    display:flex;
    gap:40px;
    margin-bottom:40px;
    flex-wrap:wrap;
  }
  .stat .num{
    font-weight:700;
    font-size:1.02rem;
    color:var(--ink);
    margin-bottom:3px;
  }
  .stat .label{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.76rem;
    color:var(--muted);
  }

  .cta{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--accent);
    color:var(--accent-ink);
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:1rem;
    padding:14px 26px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    transition:transform 0.12s, opacity 0.12s;
  }
  .cta:hover{opacity:0.92;}
  .cta:active{transform:scale(0.98);}

  /* ---------- Question panels ---------- */
  .q-eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    border:1px solid var(--border-light);
    border-radius:999px;
    padding:5px 14px 5px 10px;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.74rem;
    color:var(--accent);
    margin-bottom:20px;
  }
  .q-eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex-shrink:0;}

  h2.q-text{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.7rem;
    line-height:1.28;
    margin:0 0 18px;
    color:var(--ink);
    max-width:600px;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:14px;
    border:1px solid var(--border);
    background:var(--panel);
    border-radius:6px;
    padding:14px 16px;
    cursor:pointer;
    transition:border-color 0.15s, background 0.15s;
    font-size:0.98rem;
    color:var(--ink);
  }
  .opt:hover{border-color:var(--border-light); background:var(--panel-hover);}
  .opt input{accent-color:var(--accent); width:16px; height:16px; flex-shrink:0;}
  .opt.selected{border-color:var(--accent); background:var(--accent-soft);}
  .opt .letter{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    color:var(--accent);
  }

  .fill-block{font-size:1.06rem; line-height:2.5; color:var(--ink); margin-bottom:4px;}
  select{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:0.95rem;
    color:var(--accent);
    background:var(--panel);
    border:none;
    border-bottom:2px solid var(--accent);
    padding:4px 6px;
    margin:0 2px;
    border-radius:2px;
  }
  select:invalid{color:var(--muted);}

  .match-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    padding:12px 0;
    border-bottom:1px solid var(--border);
  }
  .match-row:last-child{border-bottom:none;}
  .match-term{
    font-weight:600;
    flex:0 0 32%;
    min-width:0;
    color:var(--ink);
  }
  .match-row select{
    flex:1 1 0;
    min-width:0;
    max-width:100%;
    border:1px solid var(--border);
    border-bottom:1px solid var(--border);
    background:var(--panel);
    color:var(--body);
    padding:10px;
    font-weight:500;
    font-family:'Inter', sans-serif;
    font-size:0.92rem;
    text-overflow:ellipsis;
    white-space:nowrap;
    overflow:hidden;
    border-radius:4px;
  }

  textarea, .open-inputs input{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size:0.98rem;
    color:var(--ink);
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:6px;
    padding:12px 14px;
  }
  textarea{min-height:100px; resize:vertical;}
  textarea::placeholder, .open-inputs input::placeholder{color:var(--muted);}
  .open-inputs{display:flex; flex-direction:column; gap:10px;}

  .reveal-btn{
    align-self:flex-start;
    background:none;
    border:1px solid var(--accent);
    color:var(--accent);
    font-family:'IBM Plex Mono', monospace;
    font-size:0.76rem;
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
    margin-top:14px;
  }
  .reveal-btn:hover{background:var(--accent-soft);}
  .model-answer{
    margin-top:12px;
    padding:12px 14px;
    background:var(--panel);
    border-left:3px solid var(--accent);
    border-radius:0 6px 6px 0;
    font-size:0.92rem;
    color:var(--body);
    display:none;
  }
  .model-answer.show{display:block;}

  .nav-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:34px;
    padding-top:22px;
    border-top:1px solid var(--border);
  }
  button.nav-btn{
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:0.92rem;
    padding:12px 22px;
    border-radius:999px;
    border:1px solid var(--accent);
    background:var(--accent);
    color:var(--accent-ink);
    cursor:pointer;
    transition:opacity 0.15s;
  }
  button.nav-btn.ghost{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--border-light);
  }
  button.nav-btn:disabled{opacity:0.3; cursor:not-allowed;}
  button.nav-btn:hover:not(:disabled){opacity:0.85;}

  .dots{
    display:flex;
    gap:7px;
    margin-bottom:34px;
    flex-wrap:wrap;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    border:1px solid var(--border-light);
    background:transparent;
    transition:background 0.2s, border-color 0.2s;
  }
  .dot.done{background:var(--ink); border-color:var(--ink);}
  .dot.current{background:var(--accent); border-color:var(--accent);}

  /* results */
  .score-hero{
    margin-bottom:34px;
  }
  .score-hero .big{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:3.6rem;
    color:var(--accent);
    line-height:1;
    margin-bottom:6px;
  }
  .score-hero .of{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.8rem;
    color:var(--muted);
  }
  .review-item{
    display:flex;
    gap:12px;
    padding:14px 0;
    border-bottom:1px solid var(--border);
    font-size:0.92rem;
  }
  .review-item:last-child{border-bottom:none;}
  .mark{
    flex-shrink:0;
    width:20px; height:20px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:0.7rem;
    font-weight:700;
    color:#fff;
    margin-top:2px;
  }
  .mark.ok{background:var(--ok);}
  .mark.bad{background:var(--bad);}
  .mark.info{background:var(--muted);}
  .review-item .rtext strong{display:block; margin-bottom:3px; color:var(--ink);}
  .review-item .rtext .muted{color:var(--body); font-size:0.87rem;}

  .restart-row{margin-top:30px;}

  /* ---------- Anticheat ---------- */
  .cheat-overlay{
    position:fixed; inset:0;
    background:rgba(10,11,16,0.82);
    display:flex; align-items:center; justify-content:center;
    z-index:9999;
    padding:20px;
    animation:cheatFade 0.15s ease-out;
  }
  @keyframes cheatFade{from{opacity:0;} to{opacity:1;}}
  .cheat-box{
    background:var(--panel);
    border:1px solid var(--bad);
    border-radius:12px;
    padding:30px 28px;
    max-width:420px;
    width:100%;
    box-shadow:0 24px 70px rgba(0,0,0,0.55);
  }
  .cheat-box .cheat-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.35rem;
    color:var(--bad);
    margin:0 0 14px;
    display:flex; align-items:center; gap:10px;
  }
  .cheat-box .cheat-title .cheat-icon{
    width:30px; height:30px; border-radius:50%;
    background:var(--bad); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:1rem; font-weight:700; flex-shrink:0;
  }
  .cheat-box p{
    color:var(--body);
    font-size:0.95rem;
    line-height:1.6;
    margin:0 0 22px;
  }
  .cheat-box p strong{color:var(--ink);}
  .cheat-box button{
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:0.92rem;
    padding:12px 22px;
    border-radius:999px;
    border:1px solid var(--bad);
    background:var(--bad);
    color:#fff;
    cursor:pointer;
    width:100%;
  }
  .cheat-box button:hover{opacity:0.9;}
  .cheat-banner{
    display:flex; align-items:flex-start; gap:12px;
    background:rgba(226,96,79,0.12);
    border:1px solid var(--bad);
    border-radius:8px;
    padding:14px 16px;
    margin-bottom:28px;
    font-size:0.9rem;
    color:var(--ink);
    line-height:1.5;
  }
  .cheat-banner .mark{flex-shrink:0;}

  @media (max-width:600px){
    .wrap{padding:36px 18px 60px;}
    h1.hero{font-size:2.8rem;}
    .stats{gap:24px;}
    .match-row{flex-direction:column; align-items:stretch; gap:8px;}
    .match-term{flex-basis:auto;}
    .score-hero .big{font-size:2.6rem;}
  }
</style>
</head>
<body>

<div class="topbar"><div class="topbar-inner"><span id="topbar-text">DATABÁZE <span class="sep">·</span> ÚVOD</span><span id="timer"></span></div></div>

<div class="wrap">
  <div class="dots" id="dots"></div>
  <div id="content"></div>
</div>

<script>
const TERMS = ["pole","filtrování","záznam","databáze","databázový systém (SŘBD)","primární klíč","dotaz","tabulka"];
const DEFS = [
  "program, který databázi spravuje a umí v ní hledat",
  "požadavek na vyhledání nebo zpracování konkrétních dat",
  "jeden konkrétní řádek v tabulce",
  "uspořádaná sbírka dat uložená pro snadné používání",
  "jednoznačně identifikuje záznam v tabulce",
  "jedna vlastnost záznamu, sloupec tabulky",
  "zobrazení pouze záznamů, které splňují zadanou podmínku",
  "uspořádaný seznam záznamů stejného typu"
];
const CORRECT_DEF_INDEX = [5,6,2,3,0,4,1,7];

const FILL_WORDS = ["záznam","pole","databáze","primární klíč","tabulka"];
const FILL_ANSWERS = ["databáze","tabulka","záznam","pole","primární klíč"];

const STEPS = [
  {type:"intro"},
  {type:"mc", id:"q1", label:"Otázka s výběrem", text:"Co je primární klíč?",
    options:["Údaj, který jednoznačně identifikuje záznam","Název celé databáze","Poslední sloupec tabulky","Údaj, který musí být u všech záznamů stejný"],
    correct:0},
  {type:"fill", id:"q2", label:"Doplňovačka pojmů"},
  {type:"match", id:"q3", label:"Spojování pojmů"},
  {type:"mc", id:"q4", label:"Otázka s výběrem", text:"Který údaj je nejvhodnější jako primární klíč v tabulce žáků?",
    options:["Jméno","Příjmení","Třída","Jedinečné číslo žáka"],
    correct:3},
  {type:"mc", id:"q5", label:"Otázka s výběrem", text:"Co je filtrování?",
    options:["Odstranění celé tabulky","Zobrazení záznamů, které splňují určitou podmínku","Vytvoření primárního klíče","Přidání nového sloupce"],
    correct:1},
  {type:"mc", id:"q6", label:"Otázka s výběrem", text:"Co je dotaz v databázi?",
    options:["Požadavek na vyhledání","Název databázové tabulky","Jeden záznam","Primární klíč"],
    correct:0},
  {type:"open-text", id:"q7", label:"Otevřená otázka", text:"Vysvětli vlastními slovy, proč může být databáze praktičtější než papírová kartotéka.",
    model:"Např.: rychlejší vyhledávání a filtrování údajů, snadnější úprava a aktualizace dat, úspora místa, možnost sdílení a zálohování, menší riziko ztráty nebo poškození dat."},
  {type:"open-list", id:"q8", label:"Otevřená otázka", text:"Představ si tabulku pacientů. Napiš alespoň čtyři údaje (pole), které by v ní mohly být uložené.",
    count:4,
    model:"Např.: jméno, příjmení, rodné číslo, datum narození, adresa, diagnóza, telefon."},
  {type:"open-list", id:"q9", label:"Otevřená otázka", text:"Máš tabulku pacientů. Napiš alespoň dva údaje, které by mohly sloužit jako primární klíč ke každému pacientovi.",
    count:2,
    model:"Např.: rodné číslo, číslo pojištěnce nebo číslo karty pacienta."},
  {type:"mc", id:"q10", label:"Otázka s výběrem", text:"Který program bys použil pro vytvoření jednoduché databáze?",
    options:["Canva","Excel","Snapchat","Outlook"],
    correct:1},
  {type:"results"}
];

let current = 0;
const answers = {};

const TIME_LIMIT = 15 * 60; // 15 minut
let timeLeft = TIME_LIMIT;
let timerInterval = null;

/* ---------- Anticheat ---------- */
let cheatStrikes = 0;
let cheatPending = false;   // opuštění bylo zaznamenáno, čeká se na návrat na stránku
let testEndedByCheat = false;

function testIsActive(){
  // test běží jen když jede časovač a nejsme na úvodu ani na výsledcích
  const step = STEPS[current];
  return timerInterval !== null && step.type !== "intro" && step.type !== "results";
}

function showCheatOverlay(box){
  const overlay = el("div","cheat-overlay");
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  return overlay;
}

function showCheatWarning(){
  const box = el("div","cheat-box");
  box.innerHTML = `
    <div class="cheat-title"><span class="cheat-icon">!</span>Opustil(a) jsi test</div>
    <p>Zaznamenali jsme, že jsi přepnul(a) okno nebo záložku. Toto je <strong>první a poslední varování</strong> — při dalším opuštění okna bude test automaticky ukončen a odešlou se aktuální odpovědi.</p>
  `;
  const btn = document.createElement("button");
  btn.textContent = "Rozumím, pokračovat v testu";
  const overlay = showCheatOverlay(box);
  btn.addEventListener("click", ()=>{ overlay.remove(); });
  box.appendChild(btn);
}

function endTestByCheat(){
  testEndedByCheat = true;
  stopTimer();
  current = STEPS.length - 1;
  render();
  window.scrollTo({top:0,behavior:"smooth"});

  const box = el("div","cheat-box");
  box.innerHTML = `
    <div class="cheat-title"><span class="cheat-icon">!</span>Test byl ukončen</div>
    <p>Opakovaně jsi opustil(a) okno testu, proto byl test automaticky ukončen a vyhodnocen s aktuálním stavem odpovědí.</p>
  `;
  const btn = document.createElement("button");
  btn.textContent = "Zobrazit výsledky";
  const overlay = showCheatOverlay(box);
  btn.addEventListener("click", ()=>{ overlay.remove(); });
  box.appendChild(btn);
}

document.addEventListener("visibilitychange", ()=>{
  // Používáme visibilitychange (ne blur/focus) - vyjetí virtuální klávesnice na mobilu
  // tuto událost nevyvolává, takže nedojde k falešnému poplachu.
  if(document.hidden){
    if(testIsActive()){
      cheatStrikes++;
      cheatPending = true;
    }
  } else if(cheatPending){
    cheatPending = false;
    if(cheatStrikes >= 2){
      endTestByCheat();
    } else {
      showCheatWarning();
    }
  }
});

function formatTime(sec){
  const m = Math.floor(sec/60);
  const s = sec%60;
  return m+":"+String(s).padStart(2,"0");
}

function updateTimerDisplay(){
  const timerEl = document.getElementById("timer");
  if(!timerEl) return;
  if(timerInterval===null && timeLeft===TIME_LIMIT){
    timerEl.textContent = "";
    timerEl.classList.remove("low");
    return;
  }
  timerEl.textContent = "⏱ "+formatTime(timeLeft);
  timerEl.classList.toggle("low", timeLeft<=60);
}

function startTimer(){
  if(timerInterval!==null) return;
  timeLeft = TIME_LIMIT;
  updateTimerDisplay();
  timerInterval = setInterval(()=>{
    timeLeft--;
    updateTimerDisplay();
    if(timeLeft<=0){
      stopTimer();
      current = STEPS.length-1;
      render();
      window.scrollTo({top:0,behavior:"smooth"});
    }
  },1000);
}

function stopTimer(){
  if(timerInterval!==null){
    clearInterval(timerInterval);
    timerInterval=null;
  }
}

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}

function questionSteps(){
  return STEPS.filter(s=>s.type!=="intro" && s.type!=="results");
}

function updateTopbar(){
  const tb = document.getElementById("topbar-text");
  const step = STEPS[current];
  let right = "ÚVOD";
  if(step.type==="results") right = "VÝSLEDEK";
  else if(step.type!=="intro"){
    const idx = STEPS.slice(0,current).filter(s=>s.type!=="intro" && s.type!=="results").length;
    right = `KARTA ${idx+1}/${questionSteps().length}`;
  }
  tb.innerHTML = `DATABÁZE <span class="sep">·</span> ${right}`;
}

function renderDots(){
  const dots = document.getElementById("dots");
  const step = STEPS[current];
  if(step.type==="intro" || step.type==="results"){ dots.style.display="none"; return; }
  dots.style.display="flex";
  dots.innerHTML = "";
  STEPS.forEach((s,i)=>{
    if(s.type==="intro" || s.type==="results") return;
    const d = el("div","dot"+(i<current?" done":"")+(i===current?" current":""));
    dots.appendChild(d);
  });
}

function navRow(step){
  const nav = el("div","nav-row");
  const back = el("button","nav-btn ghost","Zpět");
  back.disabled = current===0;
  back.addEventListener("click",()=>{ if(current>0){current--; render();} });

  const isLastQuestion = current===STEPS.length-2;
  const next = el("button","nav-btn", isLastQuestion ? "Vyhodnotit test" : "Další");
  next.addEventListener("click",()=>{ current++; render(); window.scrollTo({top:0,behavior:"smooth"}); });

  nav.appendChild(back);
  nav.appendChild(next);
  return nav;
}

function render(){
  updateTopbar();
  renderDots();
  updateTimerDisplay();
  if(STEPS[current].type==="results") stopTimer();
  const content = document.getElementById("content");
  content.innerHTML = "";
  const step = STEPS[current];

  if(step.type==="intro"){
    const eyebrow = el("div","eyebrow",`<span class="dot"></span><span>Interaktivní test</span><span class="plain">· Informatika</span>`);
    content.appendChild(eyebrow);
    content.appendChild(el("h1","hero","Databáze"));
    content.appendChild(el("p","lede","Proč si lidstvo přestalo zapisovat všechno do sešitů a tabulek v Excelu — a jak si ověříš, že rozumíš tomu, jak se v databázi hledá, filtruje a ukládá."));

    const stats = el("div","stats");
    const s1 = el("div","stat",`<div class="num">${questionSteps().length} karet</div><div class="label">struktura testu</div>`);
    const s2 = el("div","stat",`<div class="num">15 minut</div><div class="label">časový limit</div>`);
    stats.appendChild(s1); stats.appendChild(s2);
    content.appendChild(stats);

    const cta = el("button","cta","Začínáme ▶");
    cta.addEventListener("click",()=>{ startTimer(); current++; render(); });
    content.appendChild(cta);
    return;
  }

  if(step.type==="mc"){
    content.appendChild(el("div","q-eyebrow",`<span class="dot"></span>${step.label}`));
    content.appendChild(el("h2","q-text",step.text));
    const opts = el("div","options");
    step.options.forEach((optText,i)=>{
      const row = el("label","opt");
      const chosen = answers[step.id]===i;
      if(chosen) row.classList.add("selected");
      row.innerHTML = `<input type="radio" name="${step.id}" ${chosen?"checked":""}><span class="letter">${String.fromCharCode(65+i)})</span><span>${optText}</span>`;
      row.querySelector("input").addEventListener("change",()=>{ answers[step.id]=i; render(); });
      opts.appendChild(row);
    });
    content.appendChild(opts);
    content.appendChild(navRow(step));
    return;
  }

  if(step.type==="fill"){
    content.appendChild(el("div","q-eyebrow",`<span class="dot"></span>${step.label}`));
    content.appendChild(el("h2","q-text","Doplň do vět správné pojmy."));

    if(!answers.q2) answers.q2 = [null,null,null,null,null];

    function makeSelect(blankIndex){
      const sel = document.createElement("select");
      const empty = document.createElement("option");
      empty.value=""; empty.textContent="— vyber —";
      sel.appendChild(empty);
      FILL_WORDS.forEach(w=>{
        const o = document.createElement("option");
        o.value=w; o.textContent=w;
        if(answers.q2[blankIndex]===w) o.selected=true;
        sel.appendChild(o);
      });
      sel.addEventListener("change",e=>{ answers.q2[blankIndex]=e.target.value; });
      return sel;
    }

    const s1 = el("div","fill-block");
    s1.appendChild(document.createTextNode("Sbírka dat, se kterou pracuje počítačový program, se nazývá "));
    s1.appendChild(makeSelect(0));
    s1.appendChild(document.createTextNode("."));
    content.appendChild(s1);

    const s2 = el("div","fill-block");
    s2.appendChild(document.createTextNode("Uvnitř ní jsou data uspořádaná do "));
    s2.appendChild(makeSelect(1));
    s2.appendChild(document.createTextNode(", kde každý řádek představuje jeden "));
    s2.appendChild(makeSelect(2));
    s2.appendChild(document.createTextNode(" a každý sloupec jednu vlastnost neboli "));
    s2.appendChild(makeSelect(3));
    s2.appendChild(document.createTextNode("."));
    content.appendChild(s2);

    const s3 = el("div","fill-block");
    s3.appendChild(document.createTextNode("Sloupec, který každý záznam jednoznačně odlišuje od ostatních, se jmenuje "));
    s3.appendChild(makeSelect(4));
    s3.appendChild(document.createTextNode("."));
    content.appendChild(s3);

    content.appendChild(navRow(step));
    return;
  }

  if(step.type==="match"){
    content.appendChild(el("div","q-eyebrow",`<span class="dot"></span>${step.label}`));
    content.appendChild(el("h2","q-text","Ke každému pojmu vyber odpovídající definici."));

    if(!answers.q3) answers.q3 = new Array(TERMS.length).fill(null);

    const wrap = el("div",null);
    TERMS.forEach((term,i)=>{
      const row = el("div","match-row");
      row.appendChild(el("span","match-term",term));
      const sel = document.createElement("select");
      const empty = document.createElement("option");
      empty.value=""; empty.textContent="— vyber definici —";
      sel.appendChild(empty);
      DEFS.forEach((def,di)=>{
        const o = document.createElement("option");
        o.value=di; o.textContent=def;
        if(answers.q3[i]===di) o.selected=true;
        sel.appendChild(o);
      });
      sel.addEventListener("change",e=>{ answers.q3[i] = e.target.value===""? null : parseInt(e.target.value); });
      row.appendChild(sel);
      wrap.appendChild(row);
    });
    content.appendChild(wrap);
    content.appendChild(navRow(step));
    return;
  }

  if(step.type==="open-text"){
    content.appendChild(el("div","q-eyebrow",`<span class="dot"></span>${step.label}`));
    content.appendChild(el("h2","q-text",step.text));
    const ta = document.createElement("textarea");
    ta.placeholder = "Napiš svou odpověď…";
    ta.value = answers[step.id] || "";
    ta.addEventListener("input",e=>{answers[step.id]=e.target.value;});
    content.appendChild(ta);

    const btn = el("button","reveal-btn","Zobrazit vzorovou odpověď");
    const model = el("div","model-answer",step.model);
    btn.addEventListener("click",()=>{
      model.classList.toggle("show");
      btn.textContent = model.classList.contains("show") ? "Skrýt vzorovou odpověď" : "Zobrazit vzorovou odpověď";
    });
    content.appendChild(btn);
    content.appendChild(model);
    content.appendChild(navRow(step));
    return;
  }

  if(step.type==="open-list"){
    content.appendChild(el("div","q-eyebrow",`<span class="dot"></span>${step.label}`));
    content.appendChild(el("h2","q-text",step.text));
    if(!answers[step.id]) answers[step.id] = new Array(step.count).fill("");
    const wrap = el("div","open-inputs");
    for(let i=0;i<step.count;i++){
      const input = document.createElement("input");
      input.type="text";
      input.placeholder = (i+1)+".";
      input.value = answers[step.id][i] || "";
      input.addEventListener("input",e=>{answers[step.id][i]=e.target.value;});
      wrap.appendChild(input);
    }
    content.appendChild(wrap);

    const btn = el("button","reveal-btn","Zobrazit vzorovou odpověď");
    const model = el("div","model-answer",step.model);
    btn.addEventListener("click",()=>{
      model.classList.toggle("show");
      btn.textContent = model.classList.contains("show") ? "Skrýt vzorovou odpověď" : "Zobrazit vzorovou odpověď";
    });
    content.appendChild(btn);
    content.appendChild(model);
    content.appendChild(navRow(step));
    return;
  }

  if(step.type==="results"){
    renderResults(content);
    return;
  }
}

function renderResults(content){
  let score = 0, max = 0;
  const rows = [];

  if(testEndedByCheat){
    content.appendChild(el("div","cheat-banner",`<span class="mark bad">✕</span><span>Test byl automaticky ukončen, protože jsi opakovaně opustil(a) okno testu. Výsledek odpovídá stavu odpovědí v okamžiku ukončení.</span>`));
  }

  max += 1;
  const q1ok = answers.q1===0;
  if(q1ok) score+=1;
  rows.push({ok:q1ok, text:"1. Primární klíč", detail: q1ok? "Správně." : "Správná odpověď: Údaj, který jednoznačně identifikuje záznam."});

  const q2 = answers.q2 || [];
  let q2correctCount = 0;
  FILL_ANSWERS.forEach((a,i)=>{ if(q2[i]===a) q2correctCount++; });
  max += FILL_ANSWERS.length;
  score += q2correctCount;
  rows.push({ok:q2correctCount===FILL_ANSWERS.length, text:"2. Doplňovačka pojmů", detail:`Správně vyplněno ${q2correctCount} z ${FILL_ANSWERS.length} mezer. Správné pořadí: ${FILL_ANSWERS.join(", ")}.`});

  const q3 = answers.q3 || [];
  let q3correctCount = 0;
  CORRECT_DEF_INDEX.forEach((correctDi,i)=>{ if(q3[i]===correctDi) q3correctCount++; });
  max += TERMS.length;
  score += q3correctCount;
  rows.push({ok:q3correctCount===TERMS.length, text:"3. Spojování pojmů s definicemi", detail:`Správně spojeno ${q3correctCount} z ${TERMS.length} pojmů.`});

  const mcs = [
    {id:"q4", correct:3, label:"4. Primární klíč žáků", correctText:"Jedinečné číslo žáka"},
    {id:"q5", correct:1, label:"5. Filtrování", correctText:"Zobrazení záznamů, které splňují určitou podmínku"},
    {id:"q6", correct:0, label:"6. Dotaz v databázi", correctText:"Požadavek na vyhledání"}
  ];
  mcs.forEach(m=>{
    max += 1;
    const ok = answers[m.id]===m.correct;
    if(ok) score+=1;
    rows.push({ok, text:m.label, detail: ok? "Správně." : "Správná odpověď: "+m.correctText+"."});
  });

  max += 1;
  const q10ok = answers.q10===1;
  if(q10ok) score+=1;

  content.appendChild(el("div","score-hero", `<div class="big">${score} / ${max}</div><div class="of">BODŮ ZA OTÁZKY S JEDNOZNAČNOU ODPOVĚDÍ</div>`));

  const list = el("div",null);
  rows.forEach(r=>{
    const item = el("div","review-item");
    item.innerHTML = `<span class="mark ${r.ok?'ok':'bad'}">${r.ok?'✓':'✕'}</span><span class="rtext"><strong>${r.text}</strong><span class="muted">${r.detail}</span></span>`;
    list.appendChild(item);
  });

  ["q7","q8","q9"].forEach((id,i)=>{
    const labels = ["7. Databáze vs. papírová kartotéka","8. Pole v tabulce pacientů","9. Možné primární klíče pacientů"];
    const item = el("div","review-item");
    item.innerHTML = `<span class="mark info">i</span><span class="rtext"><strong>${labels[i]}</strong><span class="muted">Otevřená otázka — zkontroluj si svou odpověď podle vzorové odpovědi na dané kartě.</span></span>`;
    list.appendChild(item);
  });

  const q10item = el("div","review-item");
  q10item.innerHTML = `<span class="mark ${q10ok?'ok':'bad'}">${q10ok?'✓':'✕'}</span><span class="rtext"><strong>10. Vhodný program pro jednoduchou databázi</strong><span class="muted">${q10ok? "Správně." : "Správná odpověď: Excel."}</span></span>`;
  list.appendChild(q10item);

  content.appendChild(list);

  const restartRow = el("div","restart-row");
  const restartBtn = el("button","nav-btn","Zkusit test znovu");
  restartBtn.addEventListener("click",()=>{
    Object.keys(answers).forEach(k=>delete answers[k]);
    stopTimer();
    timeLeft = TIME_LIMIT;
    current = 0;
    cheatStrikes = 0;
    cheatPending = false;
    testEndedByCheat = false;
    render();
    window.scrollTo({top:0,behavior:"smooth"});
  });
  restartRow.appendChild(restartBtn);
  content.appendChild(restartRow);
}

render();
</script>

</body>
</html>
